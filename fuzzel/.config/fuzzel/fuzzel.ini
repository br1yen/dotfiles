[main]
font=Adwaita Sans:size=12
terminal=ghostty -e

width=60
lines=10

horizontal-pad=14
vertical-pad=12
inner-pad=10

anchor=center
layer=overlay

icon-theme=Colloid-Grey-Dark
icons-enabled=yes

prompt="> "
placeholder="Search"

match-mode=fzf
show-actions=no

[colors]
background=303030ff
text=d0d0d0ff
prompt=b8b8c8ff
placeholder=88888fff
input=e0e0e0ff
counter=888888ff

selection=ffffff1a
selection-text=ffffffff
selection-match=ffffffff

match=ffffff80
border=000000ff

[border]
width=1
radius=0
selection-radius=0
