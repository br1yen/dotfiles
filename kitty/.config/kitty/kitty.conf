font_family Liga Inconsolata Liga
font_size   12.0

copy_on_select   clipboard
resize_in_steps  no
confirm_os_window_close 0

scrollback_lines 10000

pixel_scroll             yes
touch_scroll_multiplier  1.0
wheel_scroll_multiplier  5.0
wheel_scroll_min_lines   1

input_delay   0
repaint_delay 2

cursor_shape          block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 1
shell_integration no-cursor

enable_audio_bell    no
window_alert_on_bell no
bell_on_tab          no
visual_bell_duration 0

mouse_map right press ungrabbed no-op

# colors
background #1a1a1a
foreground #dadada
cursor #bfad9e
cursor_text_color #1a1a1a
selection_background #2d2d2d
selection_foreground #c0af8c
color0 #1a1a1a
color1 #d29393
color2 #b3b393
color3 #cbaa89
color4 #a8a1be
color5 #b39fb0
color6 #c0af8c
color7 #dadada
color8 #5b5b5b
color9 #c95954
color10 #828040
color11 #a6794c
color12 #5a6599
color13 #9c6995
color14 #74a39e
color15 #ffffff
