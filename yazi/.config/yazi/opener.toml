[open]
rules = [
	# Neovim: text and code files
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/javascript", use = "edit" },

	# MPV: video and audio
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "play" },

	# imv: images
	{ mime = "image/*", use = "view" },

	# Zathura: PDFs
	{ mime = "application/pdf", use = "pdf" },
]
