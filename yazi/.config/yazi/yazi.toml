[mgr]
sort_by="natural"
sort_dir_first=true
show_hidden=false
show_symlink=true

[preview]
wrap="no"
cache = false

[opener]
image = [
    { run = "imv %s", orphan = true, for = "linux" },
]
pdf = [
    { run = "zathura %s", orphan = true, for = "linux" },
]
[open]
prepend_rules = [
    { mime = "image/*", use = "image" },
    { mime = "application/pdf", use = "pdf" },
]
