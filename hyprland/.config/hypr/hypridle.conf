general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/idle.sh restore
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/idle.sh light
    on-resume = ~/.config/hypr/scripts/idle.sh restore
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle.sh medium
    on-resume = ~/.config/hypr/scripts/idle.sh restore
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
