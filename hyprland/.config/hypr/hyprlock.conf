general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = cmd[update:1000] date '+%b %-d, %y  %H:%M'
    color = rgb(dadada)
    font_size = 14
    font_family = Inconsolata
    position = 0, -30
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 300, 40
    outline_thickness = 0
    dots_text_format = *
    dots_center = true
    inner_color = rgb(000000)
    outer_color = rgb(000000)
    font_color = rgb(dadada)
    check_color = rgb(000000)
    fail_color = rgb(000000)
    font_family = Inconsolata
    fade_on_empty = false
    placeholder_text =
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}
