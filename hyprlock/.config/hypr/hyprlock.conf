general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/sync/pictures/mt.jpeg
    blur_passes = 0
}

input-field {
    monitor =
    size = 240, 38
    position = 0, -20
    halign = center
    valign = center

    # shape
    rounding = 12
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.35
    dots_rounding = -1
    fade_on_empty = true
    fade_timeout = 1000
    hide_input = false

    # colors
    inner_color = rgba(24242499)
    outer_color = rgba(ffffff26)
    font_color = rgba(ffffffff)
    check_color = rgba(78aeedff)
    fail_color = rgba(ff7b63ff)
    capslock_color = rgba(ffa348ff)

    font_family = Inter
    font_size = 14
    placeholder_text =
    fail_text =
}

# time
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = Inter
    color = rgba(ffffffff)
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 24
    font_family = Inter
    color = rgba(dedddaff)
    position = 0, 90
    halign = center
    valign = center
}
