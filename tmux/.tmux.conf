# General
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -gq allow-passthrough on
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on

# Terminal & True Color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-ghostty:Tc"

# Panes
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V send-keys -X select-line

# Status bar configuration
set -g status-position top
set -g status-justify centre
set -g status-style bg=default,fg=default
set -g status-left-length 10
set -g status-left " #S "
set -g status-right ""

# Window status format (Plain text, bold current window)
set-window-option -g window-status-format " #I:#W "
set -g window-status-current-style "nounderscore"
set-window-option -g window-status-current-format "#[bold] #I:#W #[default]"

# Sessionizer
set -g popup-border-lines single
set -g popup-border-style fg=white
set -g popup-style bg=default
bind f display-popup -E -w 50% -h 40% "~/.local/bin/tmux-sessionizer"
bind -n M-0 run-shell "~/.local/bin/tmux-sessionizer home"
bind -n M-1 run-shell "~/.local/bin/tmux-sessionizer config"
bind -n M-2 run-shell "~/.local/bin/tmux-sessionizer notes"
bind -n M-3 run-shell "~/.local/bin/tmux-sessionizer csc301"
bind -n M-4 run-shell "~/.local/bin/tmux-sessionizer rel103"
bind -n M-5 run-shell "~/.local/bin/tmux-sessionizer snc185"
