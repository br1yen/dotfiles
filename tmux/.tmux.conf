unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 10
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-*:RGB:clipboard:hyperlinks:usstyle"
set -gq allow-passthrough on
set -g set-clipboard on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind f display-popup -E -w 50% -h 50% "~/.local/bin/tmux-sessionizer"
bind -n M-0 run "~/.local/bin/tmux-sessionizer home"
bind -n M-1 run "~/.local/bin/tmux-sessionizer config"
bind -n M-2 run "~/.local/bin/tmux-sessionizer notes"
bind -n M-3 run "~/.local/bin/tmux-sessionizer csc301"
bind -n M-4 run "~/.local/bin/tmux-sessionizer rel103"
bind -n M-5 run "~/.local/bin/tmux-sessionizer snc185"

set -g status-position top
set -g status-justify centre
set -g status-left-length 10
set -g status-left " #S "
set -g status-right ""
set -g status-style "bg=default,fg=#5b5b5b"
set -g status-left-style "fg=blue"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=green"
set -g message-style "bg=default,fg=cyan"
set -g mode-style "bg=#2d2d2d,fg=cyan"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g popup-border-style "fg=brightblack"
